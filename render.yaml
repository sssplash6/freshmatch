services:
  - type: web
    name: calc-api
    runtime: node
    # Build the frontend too — the same service serves dist/ so the app's
    # relative /api calls resolve without CORS or a separate static host.
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Persistent disk for the SQLite submissions database. Survives deploys and
    # restarts. Note: a disk pins the service to a single instance and makes
    # deploys briefly non-zero-downtime.
    disk:
      name: calc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.6
      # SQLite file on the mounted disk. Submissions are stored when this is set.
      # Per-College Report PDFs cache themselves next to it at /var/data/reports
      # (REPORTS_DIR overrides; REPORTS_MAX_BYTES caps the cache, default 500MB
      # with LRU eviction — sized to leave the database room on the 1GB disk).
      - key: DATABASE_PATH
        value: /var/data/submissions.sqlite
      # Token guarding GET /api/submissions. Endpoint is disabled when unset.
      - key: ADMIN_TOKEN
        sync: false
      # Email verification. RESEND_API_KEY sends the 6-digit codes; without it
      # codes are only logged (dev). VERIFY_FROM must be a Resend-verified sender.
      # VERIFY_SECRET keeps verified-email tokens valid across restarts.
      - key: RESEND_API_KEY
        sync: false
      - key: VERIFY_FROM
        sync: false
      - key: VERIFY_SECRET
        sync: false
